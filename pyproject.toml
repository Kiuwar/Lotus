[project]
name = "lotus"
dynamic = ["version"]
description = "Conversor de arquivos offline para Windows"
requires-python = ">=3.11"
dependencies = [
    "pillow==12.3.0",
    "openpyxl==3.1.5",
    "fpdf2==2.8.9",
    "markdown==3.11.2",
    "pypdf==6.21.2",
    "pypdfium2==5.14.0",
    "pywin32==312; sys_platform == 'win32'",
    "pyobjc-framework-Quartz==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'",
]

[project.scripts]
conversor = "conversor.cli:main"

[project.gui-scripts]
conversor-gui = "conversor.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "conversor.__version__" }

[tool.setuptools.packages.find]
include = ["conversor*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Teste parado há 2 min → o pytest imprime onde cada thread está (sem matar).
faulthandler_timeout = 120
