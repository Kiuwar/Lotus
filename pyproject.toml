[project]
name = "lotus"
dynamic = ["version"]
description = "Conversor de arquivos offline para Windows e Mac"
requires-python = ">=3.11"
dependencies = [
    "pillow==12.3.0",
    "openpyxl==3.1.5",
    "fpdf2==2.8.9",
    "markdown==3.11.2",
    "pypdf==6.21.2",
    "pypdfium2==5.14.0",
    "defusedxml==0.7.1",
    "pi-heif==1.4.0",
    "numpy==2.5.4",
    "trimesh==5.1.1",
    "networkx==3.7",
    "lxml==6.1.3",
    "shapely==2.2.0",
    "mapbox-earcut==2.1.0",
    "svgelements==1.9.6",
    "resvg-py==0.5.0",
    "svglib==2.3.2",
    "reportlab==5.1.0",
    "ezdxf==1.4.5",
    "pywin32==312; sys_platform == 'win32'",
    "winrt-runtime==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Foundation.Collections==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Globalization==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Graphics.Imaging==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Media.Ocr==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage==3.2.1; sys_platform == 'win32'",
    "winrt-Windows.Storage.Streams==3.2.1; sys_platform == 'win32'",
    "certifi==2026.10.23; sys_platform == 'darwin'",
    "pyobjc-framework-Quartz==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Cocoa==12.2.2; sys_platform == 'darwin'",
    "pyobjc-framework-Vision==12.2.2; sys_platform == 'darwin'",
]

[project.scripts]
conversor = "conversor.cli:main"

[project.gui-scripts]
conversor-gui = "conversor.gui:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools.dynamic]
version = { attr = "conversor.__version__" }

[tool.setuptools.packages.find]
include = ["conversor*"]

[tool.setuptools.package-data]
conversor = ["recursos/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
# Teste parado há 2 min → o pytest imprime onde cada thread está (sem matar).
faulthandler_timeout = 120
