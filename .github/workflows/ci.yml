name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        # Se falhar, os testes de áudio/vídeo são PULADOS (e aparecem como skipped no log).
        continue-on-error: true
        run: choco install ffmpeg -y --no-progress

      - name: Testes (Linux, com display virtual para a interface)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v -rs
      - name: Testes (Windows)
        if: runner.os == 'Windows'
        # O choco instala atalhos em C:\ProgramData\chocolatey\bin, que já está no PATH.
        run: python -m pytest -v -rs

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      - name: Empacotar
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name Lotus --paths . packaging/app_gui.py
          pyinstaller --noconfirm --clean --console --onefile --name conversor-cli --paths . packaging/app_cli.py
          Copy-Item dist/conversor-cli.exe dist/Lotus/
          Copy-Item README.md, docs/FORMATOS.md dist/Lotus/

      - name: Teste do executável empacotado
        shell: pwsh
        run: |
          $exe = "dist/Lotus/conversor-cli.exe"
          & $exe --listar
          if ($LASTEXITCODE -ne 0) { throw "--listar falhou" }
          python -c "from PIL import Image; Image.new('RGBA',(32,32),(255,0,0,128)).save('t.png')"
          "Olá, ação`n" | Out-File -Encoding utf8 t.txt
          & $exe t.png t.txt --para pdf --saida saida
          if ($LASTEXITCODE -ne 0) { throw "conversão falhou no executável" }
          if (!(Test-Path saida/t.pdf)) { throw "PDF não gerado" }

      - name: Teste do menu do botão direito (registro real do Windows)
        shell: pwsh
        run: |
          $dir = (Resolve-Path dist/Lotus).Path
          & "$dir/conversor-cli.exe" --instalar-menu
          if ($LASTEXITCODE -ne 0) { throw "instalação do menu falhou" }
          $key = "HKCU:\Software\Classes\SystemFileAssociations\.png\shell\Lotus.Converter"
          $label = (Get-ItemProperty $key).MUIVerb
          if ($label -ne "Converter para") { throw "rótulo inesperado: $label" }
          $cmd = (Get-ItemProperty "$key\shell\14_pdf\command").'(default)'
          Write-Host "Comando registrado: $cmd"
          # Mesmo instalado pelo CLI, o menu precisa chamar o Lotus.exe (com janela).
          if ($cmd -ne "`"$dir\Lotus.exe`" --menu-converter pdf `"%1`"") { throw "comando inesperado" }
          & "$dir/conversor-cli.exe" --reparar
          & "$dir/conversor-cli.exe" --remover-menu
          if (Test-Path $key) { throw "menu não foi removido" }

      - uses: actions/upload-artifact@v4
        with:
          name: Lotus-windows
          path: dist/Lotus/
