name: CI

on:
  push:
  pull_request:

jobs:
  test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      - name: ffmpeg (Linux)
        if: runner.os == 'Linux'
        run: sudo apt-get update && sudo apt-get install -y ffmpeg xvfb
      - name: ffmpeg (Windows)
        if: runner.os == 'Windows'
        # Se falhar, os testes de áudio/vídeo são PULADOS (e aparecem como skipped no log).
        continue-on-error: true
        run: choco install ffmpeg -y --no-progress

      - name: Testes (Linux, com display virtual para a interface)
        if: runner.os == 'Linux'
        run: xvfb-run -a python -m pytest -v -rs
      - name: Testes (Windows)
        if: runner.os == 'Windows'
        # O choco instala atalhos em C:\ProgramData\chocolatey\bin, que já está no PATH.
        run: python -m pytest -v -rs

  build-windows:
    needs: test
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: pip install -r requirements-dev.txt

      - name: Empacotar
        shell: pwsh
        run: |
          pyinstaller --noconfirm --clean --windowed --onedir --name KiuwarConversor --paths . packaging/app_gui.py
          pyinstaller --noconfirm --clean --console --onefile --name conversor-cli --paths . packaging/app_cli.py
          Copy-Item dist/conversor-cli.exe dist/KiuwarConversor/
          Copy-Item README.md, docs/FORMATOS.md dist/KiuwarConversor/

      - name: Teste do executável empacotado
        shell: pwsh
        run: |
          $exe = "dist/KiuwarConversor/conversor-cli.exe"
          & $exe --listar
          if ($LASTEXITCODE -ne 0) { throw "--listar falhou" }
          python -c "from PIL import Image; Image.new('RGBA',(32,32),(255,0,0,128)).save('t.png')"
          "Olá, ação`n" | Out-File -Encoding utf8 t.txt
          & $exe t.png t.txt --para pdf --saida saida
          if ($LASTEXITCODE -ne 0) { throw "conversão falhou no executável" }
          if (!(Test-Path saida/t.pdf)) { throw "PDF não gerado" }

      - uses: actions/upload-artifact@v4
        with:
          name: KiuwarConversor-windows
          path: dist/KiuwarConversor/
